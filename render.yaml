services:
  # Servicio Web para el Backend (Python/FastAPI)
  - type: web
    name: exosky-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    root: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
